name: Docker Build and Push

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_CLI_AGGREGATE: 1
      DOCKER_BUILDKIT: 1

    strategy:
      matrix:
        jdk_version:
          - 11
          - 17
          - 21
        maven_version:
          - 3.9.6

    steps:
      - name: Checkout code

        uses: actions/checkout@v4
      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and push Docker image
        env:
          IMAGE: ${{ vars.DOCKER_HUB_USERNAME }}/ci-builder-maven
          JDK: ${{ matrix.jdk_version }}
          MAVEN: ${{ matrix.maven_version }}
          RUN: ${{ github.run_number }}
          # Only this matrix leg publishes the unqualified tags (latest, <maven>),
          # otherwise parallel legs race and the last one to finish wins.
          DEFAULT_JDK: 21
        run: |
          TAGS="-t ${IMAGE}:${MAVEN}-jdk${JDK} -t ${IMAGE}:${MAVEN}-jdk${JDK}-${RUN}"
          if [ "${JDK}" = "${DEFAULT_JDK}" ]; then
            TAGS="${TAGS} -t ${IMAGE}:latest -t ${IMAGE}:${MAVEN}"
          fi
          docker buildx create --use
          docker buildx build \
            ${TAGS} \
            --build-arg JDK_VERSION=${JDK} \
            --build-arg MAVEN_VERSION=${MAVEN} \
            --push .
